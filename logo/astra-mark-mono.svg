<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.25 -1.5 99.3 99.3" role="img" aria-labelledby="astra-mark-mono-t astra-mark-mono-d"><title id="astra-mark-mono-t">ASTRA</title><desc id="astra-mark-mono-d">ASTRA mark: a letter A drawn as a constellation and a past light cone. Two input stars at the feet, a rising decision crossbar with a considered option as an open ring and the selected option in gold, and a gold link from the selected option up to a gold four-pointed star, the result, at the apex.</desc><g class="astra-links" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M45.56 24.4L27.11 59.34M19.54 73.66L15.91 80.55M75.98 65.19L84.65 81.61M31.29 65.02L63.36 59.08"/></g><g class="astra-path" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M67.86 49.81L54.44 24.4"/></g><g class="astra-stars" fill="currentColor"><circle cx="12.5" cy="87" r="4.8"/><circle cx="87.5" cy="87" r="3.6"/></g><g class="astra-options" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="23.33" cy="66.5" r="4.3"/></g><g class="astra-universe" fill="currentColor"><circle cx="71.92" cy="57.5" r="6.2"/><path d="M50 4.5C50 13.01 52.6 16 60 16C52.6 16 50 18.99 50 27.5C50 18.99 47.4 16 40 16C47.4 16 50 13.01 50 4.5Z"/></g></svg>
